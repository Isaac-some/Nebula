name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Verify browser demo
        run: |
          mkdir -p temp/pages-preview
          ln -s ../../out temp/pages-preview/Nebula
          python3 -m http.server 3220 --bind 127.0.0.1 --directory temp/pages-preview > /tmp/nebula-pages.log 2>&1 &
          ATLAS_TEST_URL=http://127.0.0.1:3220/Nebula/ ATLAS_BROWSER_DEMO=true npx playwright test tests/browser-demo.spec.ts tests/import-skill.spec.ts tests/render.spec.ts tests/graph-drag.spec.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, pages-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
